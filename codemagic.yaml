workflows:
  # ─────────────────────────────────────────────────────────────
  # ANDROID — Full store release (first time or new native code)
  # ─────────────────────────────────────────────────────────────
  android-release:
    name: Android Release (Shorebird)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - firebase_credentials
        - shorebird_credentials   # contains SHOREBIRD_TOKEN
      flutter: stable
      java: 17
    scripts:
      - name: Install Shorebird
        script: |
          curl --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh -sSf | bash
          echo PATH="$HOME/.shorebird/bin:$PATH" >> $CM_ENV
      - name: Get Flutter packages
        script: |
          shorebird flutter pub get
      - name: Run Analyze
        script: |
          shorebird flutter analyze
      - name: Run tests
        script: |
          shorebird flutter test
      - name: Shorebird Release (Android)
        script: |
          shorebird release android \
            --flutter-version stable \
            -- --build-name=$PROJECT_BUILD_NAME --build-number=$BUILD_NUMBER
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/bundle/release/app-release.aab
    publishing:
      firebase:
        firebase_service_account: $FIREBASE_SERVICE_ACCOUNT
        android:
          app_id: 1:712467823098:android:aabcf03d7516ee50df8c43
          groups:
            - qa-team

  # ─────────────────────────────────────────────────────────────
  # ANDROID — OTA patch (Dart-only changes, no store review)
  # ─────────────────────────────────────────────────────────────
  android-patch:
    name: Android OTA Patch (Shorebird)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      groups:
        - shorebird_credentials   # contains SHOREBIRD_TOKEN
      flutter: stable
      java: 17
    scripts:
      - name: Install Shorebird
        script: |
          curl --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh -sSf | bash
          echo PATH="$HOME/.shorebird/bin:$PATH" >> $CM_ENV
      - name: Get Flutter packages
        script: |
          shorebird flutter pub get
      - name: Push OTA patch (Android)
        script: |
          shorebird patch android \
            --flutter-version stable

  # ─────────────────────────────────────────────────────────────
  # iOS — Full store release (first time or new native code)
  # ─────────────────────────────────────────────────────────────
  ios-release:
    name: iOS Release (Shorebird)
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      groups:
        - shorebird_credentials   # contains SHOREBIRD_TOKEN
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install Shorebird
        script: |
          curl --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh -sSf | bash
          echo PATH="$HOME/.shorebird/bin:$PATH" >> $CM_ENV
      - name: Get Flutter packages
        script: |
          shorebird flutter pub get
      - name: Pod install
        script: |
          cd ios && pod install
      - name: Shorebird Release (iOS)
        script: |
          shorebird release ios \
            --flutter-version stable \
            -- --build-name=$PROJECT_BUILD_NAME --build-number=$BUILD_NUMBER
    artifacts:
      - build/ios/ipa/*.ipa

  # ─────────────────────────────────────────────────────────────
  # iOS — OTA patch (Dart-only changes, no App Store review)
  # ─────────────────────────────────────────────────────────────
  ios-patch:
    name: iOS OTA Patch (Shorebird)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      groups:
        - shorebird_credentials   # contains SHOREBIRD_TOKEN
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install Shorebird
        script: |
          curl --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh -sSf | bash
          echo PATH="$HOME/.shorebird/bin:$PATH" >> $CM_ENV
      - name: Get Flutter packages
        script: |
          shorebird flutter pub get
      - name: Pod install
        script: |
          cd ios && pod install
      - name: Push OTA patch (iOS)
        script: |
          shorebird patch ios \
            --flutter-version stable
